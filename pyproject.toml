[project]
name = "spodnn"
version = "0.1.0"
description = "sPOD-NN: non-intrusive model order reduction for transport-dominated problems, as an MLOps product"
readme = "README.md"
requires-python = ">=3.12"
# Direct runtime dependencies only. Exact versions live in uv.lock.
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "torch",
    "pandas",
    "matplotlib",
    "numba",
    "spod-vendored",
    "lightning>=2.6.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "polartransform>=2.0.0",
    "zarr>=3.4.1",
]

[project.scripts]
spodnn = "spodnn.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest",
    "ruff",
]

[tool.uv]
# Use only uv-installed Pythons, never a conda or Homebrew one found on PATH.
python-preference = "only-managed"
# Platforms we lock for: Apple-silicon Macs (development) and Linux (CI, Docker).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

# On Linux, take torch from the CPU-only index: the default PyPI wheel bundles
# CUDA libraries (several GB) that CI and the Docker image never use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
spod-vendored = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["sPOD"]

[tool.pytest.ini_options]
markers = ["slow: takes minutes (runs sPOD); skip with -m 'not slow'"]


[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["paper", "sPOD", "DL-ROM", "WildlandFire_model"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Ignore `UP` `(pyupgrade)`.
"scripts/make_golden.py" = ["UP"]
